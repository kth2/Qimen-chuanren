<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3c763d">
  <title>奇门穿壬 · 排盘</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <!-- 奇门盘面样式：直接用 Qimen-pwa 的 style.css，不另抄一份 -->
  <link rel="stylesheet" href="vendor/qimen-pwa/style.css">
  <style>
    /* 以下页面骨架样式与 Qimen-pwa index.html 内联样式同一套 */
    body { padding: 4px 4px 8px; max-width: 720px; margin: 0 auto; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .pwa-controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
    .pwa-controls label { font-size: 13px; }
    .pwa-controls input, .pwa-controls select { padding: 4px 6px; font-size: 14px; }
    .seg { display: inline-flex; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; }
    .seg button { border: none; background: #fff; padding: 6px 14px; font-size: 14px; }
    .seg button.on { background: #3c763d; color: #fff; }
    .btn { background: #3c763d; color: #fff; border: none; border-radius: 6px; padding: 7px 16px; font-size: 15px; }
    .panel { border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin: 10px 0; }
    .panel h3 { margin: 0 0 8px; font-size: 16px; }
    .muted { color: #888; font-size: 12px; }
    #basicInfo .item { display: inline-block; margin-right: 12px; font-size: 13px; }

    /* ---- 穿壬层：本应用独有 ---- */
    .exp-badge { display: inline-block; font-size: 11px; color: #8a6d3b; border: 1px solid #e0c98f; background: #fcf8e3; border-radius: 4px; padding: 0 5px; vertical-align: middle; }
    /* 合盘：5×5 网格，中间 3×3 放 Qimen-pwa 的九宫，四周十二格是地支方位 */
    .cr-pan { padding: 2px; }
    .cr-board { display: grid; grid-template-columns: 24px repeat(3, minmax(0, 1fr)) 24px;
      grid-template-rows: auto repeat(3, minmax(0, 1fr)) auto; gap: 2px; max-width: 540px; margin: 0 auto; }
    .cr-center { grid-row: 2 / 5; grid-column: 2 / 5; container-type: inline-size; }
    .cr-center .pan-grid { max-width: none; }
    .cr-ob { background: #fbfaf6; border: 1px solid #e6e0d0; border-radius: 4px; text-align: center; line-height: 1.15; min-width: 0; }
    .cr-ob-h { padding: 3px 2px; }
    .cr-ob-h > div { display: flex; justify-content: center; align-items: baseline; gap: 4px; }
    .cr-ob-v { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; padding: 2px 0; }
    .ob-zhi { font-size: 17px; font-weight: 700; color: #333; }
    .cr-ob-v .ob-zhi { font-size: 15px; }
    .ob-jiang { font-size: 14px; }
    .ob-gan { font-size: 12px; color: #666; }
    .ob-kong-t { color: #999; }
    .ob-di { font-size: 10px; color: #aaa; }
    .ob-gui { border-color: #d4a017; background: #fff8e1; }
    .ob-tag { display: inline-block; font-size: 10px; line-height: 14px; background: #6f5499; color: #fff; border-radius: 3px; padding: 0 2px; }
    .ji { color: #3c763d; } .xiong { color: #a94442; }
    /* 我宫、事宫、第二方位：用内阴影与内缩描边，不撑开宫格 */
    .pan-grid .gong.cr-me { box-shadow: inset 0 0 0 2px #3c763d; }
    .pan-grid .gong.cr-shi { box-shadow: inset 0 0 0 2px #c27c0e; }
    .pan-grid .gong.cr-me.cr-shi { box-shadow: inset 0 0 0 2px #3c763d, inset 0 0 0 4px #c27c0e; }
    .pan-grid .gong.cr-dir { outline: 2px dashed #6f5499; outline-offset: -5px; }
    .cr-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; margin: -4px 0 8px; align-items: center; }
    .cr-legend .sw { display: inline-block; width: 12px; height: 12px; vertical-align: -2px; margin-right: 3px; border-radius: 2px; }
    .sw-me { box-shadow: inset 0 0 0 2px #3c763d; } .sw-shi { box-shadow: inset 0 0 0 2px #c27c0e; }
    .sw-dir { outline: 2px dashed #6f5499; outline-offset: -2px; }

    /* 合盘里九宫比整屏窄。Qimen-pwa 按「屏宽」分档缩字；这里改按「九宫实际宽度」分同样的档，
     * 档位＝原屏宽档减去页边与盘边（约 38px），字号、角标偏移照搬原档，不另定。 */
    @container (max-width: 401px) {
      .cr-center .gong-jiuxing, .cr-center .gong-bamen, .cr-center .gong-tiangan, .cr-center .gong-dipan { font-size: 16px; }
      .cr-center .gong-bashen, .cr-center .gong-dizhi { font-size: 14px; }
      .cr-center .gong-content .hg > .harm-mark { top: -8px; }
    }
    @container (max-width: 381px) {
      .cr-center .feipan-gong-content .fp-xing { font-size: 13px; }
      .cr-center .feipan-gong-content .fp-row { font-size: 10px; }
      .cr-center .feipan-gong-content .fp-row .fp-an { font-size: 9px; }
      .cr-center .feipan-gong-content .fp-gongname { font-size: 9px; }
      .cr-center .feipan-gong-content .fp-row-harm,
      .cr-center .feipan-gong-content .fp-ren.fp-row-harm { margin-top: 10px; }
      .cr-center .feipan-gong-content .harm-mark { font-size: 7px; }
      .cr-center .feipan-gong-content .hg > .harm-mark { top: -10px; }
    }
    @container (max-width: 354px) {
      .cr-center .gong-jiuxing, .cr-center .gong-bamen, .cr-center .gong-tiangan, .cr-center .gong-dipan { font-size: 15px; }
      .cr-center .gong-bashen, .cr-center .gong-dizhi { font-size: 13px; }
      .cr-center .gong-content .harm-mark { font-size: 8px; }
      .cr-center .gong-content .hg > .harm-mark { top: -7px; }
    }
    @container (max-width: 337px) {
      .cr-center .gong-jiuxing, .cr-center .gong-bamen, .cr-center .gong-tiangan, .cr-center .gong-dipan { font-size: 14px; }
      .cr-center .gong-bashen, .cr-center .gong-dizhi { font-size: 12px; }
    }
    @container (max-width: 321px) {
      .cr-center .gong-jiuxing, .cr-center .gong-bamen, .cr-center .gong-tiangan, .cr-center .gong-dipan { font-size: 13px; }
      .cr-center .gong-bashen, .cr-center .gong-dizhi { font-size: 12px; }
      .cr-center .gong-content .hg > .harm-mark { display: none; }
      .cr-center .feipan-gong-content .fp-row-harm,
      .cr-center .feipan-gong-content .fp-ren.fp-row-harm { margin-top: 0; }
      .cr-center .feipan-gong-content .hg > .harm-mark { display: none; }
    }
    .rule-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .rule-table th, .rule-table td { border-bottom: 1px solid #eee; padding: 5px 4px; text-align: left; vertical-align: top; }
    .rule-table th { color: #666; font-weight: 600; }
    .rule-table td:first-child { width: 7.5em; white-space: nowrap; }
    .rule-table td:nth-child(2) { width: 2.5em; }
    .vote { font-weight: 700; white-space: nowrap; }
    .vote.p { color: #3c763d; } .vote.n { color: #a94442; } .vote.z { color: #888; }
  </style>
</head>
<body>
  <h2 style="text-align:center;margin:6px 0;">奇门穿壬 · 排盘 <span class="exp-badge">实验</span></h2>

  <div class="pwa-controls">
    <span class="seg" id="viewSeg">
      <button data-view="merged" class="on">合盘</button>
      <button data-view="qimen">只看奇门</button>
    </span>
    <span class="seg" id="schoolSeg">
      <button data-school="zhuanpan" class="on">转盘</button>
      <button data-school="feipan">飞盘（括囊）</button>
    </span>
    <label>日期 <input type="date" id="inDate"></label>
    <label>时间 <input type="time" id="inTime"></label>
    <label>局
      <select id="inJuShu">
        <option value="">跟随日期时间（自动起局）</option>
        <optgroup label="阳遁">
          <option value="yang-1">阳遁1局</option><option value="yang-2">阳遁2局</option><option value="yang-3">阳遁3局</option>
          <option value="yang-4">阳遁4局</option><option value="yang-5">阳遁5局</option><option value="yang-6">阳遁6局</option>
          <option value="yang-7">阳遁7局</option><option value="yang-8">阳遁8局</option><option value="yang-9">阳遁9局</option>
        </optgroup>
        <optgroup label="阴遁">
          <option value="yin-1">阴遁1局</option><option value="yin-2">阴遁2局</option><option value="yin-3">阴遁3局</option>
          <option value="yin-4">阴遁4局</option><option value="yin-5">阴遁5局</option><option value="yin-6">阴遁6局</option>
          <option value="yin-7">阴遁7局</option><option value="yin-8">阴遁8局</option><option value="yin-9">阴遁9局</option>
        </optgroup>
      </select>
    </label>
    <label>占类
      <select id="inDomain">
        <option value="综合">综合</option><option value="事业">事业</option><option value="财运">财运</option>
        <option value="婚姻">婚姻</option><option value="健康">健康</option><option value="学业">学业</option>
        <option value="出行">出行</option><option value="行人">行人</option><option value="失物">失物</option><option value="寻人">寻人</option>
        <option value="怀孕">怀孕</option><option value="官司">官司</option><option value="风水">风水</option>
      </select>
    </label>
    <label title="规则 6 要用年支，所以须选完整干支">年命 <select id="inNianMing"><option value="">不提供</option></select></label>
    <button class="btn" id="castBtn">排盘</button>
  </div>

  <div id="basicInfo" class="panel" style="display:none;"></div>
  <div id="chart"></div>
  <div id="chuanren"></div>

  <p class="muted" style="text-align:center;margin:16px 0;">
    奇门排盘与五行推理取自 <a href="https://github.com/kth2/Qimen-pwa">Qimen-pwa</a>；六壬基准为《大六壬探原》。
    穿壬规则为自创实验流派，尚未经案例检验。
  </p>

  <script src="vendor/qimen-pwa/engine.bundle.js"></script>
  <script src="vendor/qimen-pwa/core/wangshuai.js"></script>
  <script src="vendor/qimen-pwa/core/wuxing.js"></script>
  <script src="lib/tyme4ts.js"></script>
  <script src="core/liuren/tiandipan.js"></script>
  <script src="core/liuren/yuejiang.js"></script>
  <script src="core/rules.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('[sw] 注册失败：', e.message); });
      navigator.serviceWorker.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'sw-updated' && !sessionStorage.getItem('sw-reloaded')) {
          sessionStorage.setItem('sw-reloaded', '1'); location.reload();
        }
      });
    }
  </script>
</body>
</html>
